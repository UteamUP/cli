name: CLI CI

permissions: {}

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race -v

      - name: Build
        run: go build -o bin/uteamup .

      # CRA / NIS2 evidence: CycloneDX SBOM is a CI + GitHub Release artifact.
      # Fail this job if the generator crashes. Do not fail on advisory/CVE noise.
      - name: Generate CycloneDX SBOM
        run: |
          set -euo pipefail
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.11.0
          cyclonedx-gomod app -json -output sbom-cli.cdx.json
          test -s sbom-cli.cdx.json
      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cli-cyclonedx
          path: sbom-cli.cdx.json
          if-no-files-found: error

  conventional-commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
